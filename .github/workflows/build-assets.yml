name: Build Vite Assets

on:
  push:
    branches:
      - Staging

jobs:
  build:
    runs-on: ubuntu-latest
    # Prevent infinite loop: skip if the triggering commit was made by this bot
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Staging

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Commit built assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/dist -f
          git diff --staged --quiet || git commit -m "chore: build Vite assets [skip ci]"
          git push